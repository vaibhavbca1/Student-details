<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students Details</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            background-color: #f4f4f4;
        }

        .container {
            width: 500px;
            margin: auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;

        }

        input {
            width: 100%;
            margin: 8px 0;
            padding: 10px;
        }

        button {
            color: white;
            background-color: blue;
            padding: 10px 15px;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: red;
            color: aqua;
        }

        #output {
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="hidebox">
            <h2>Student Details Form</h2>

            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Enter the name" required><br>
            <label for="roll">Roll No.</label>
            <input type="number" id="roll" name="roll" placeholder="Enter the rollno." required><br>
            <label for="course">Course</label>
            <input type="text" id="course" name="course" placeholder="Enter the course" required><br>
            <label for="add">Address</label>
            <input type="text" id="add" name="add" placeholder="Enter the address" required><br>
            <button onclick="submit()">Submit</button>

        </div>

        <div id="output"></div>
    </div>

    <script>
        function submit() {
            let name = document.getElementById("name").value;
            let roll = document.getElementById("roll").value;
            let course = document.getElementById("course").value;
            let address = document.getElementById("add").value;

            document.getElementById("hidebox").style.display = "none";

            document.getElementById("output").innerHTML =
                `
                <h2>Student Details</h2>
                <div>Name : ${name}</div>
                <div>Roll No. : ${roll}</div>
                <div>Course : ${course}</div>
                <div>Address : ${address}</div>
                <button onclick="pdf()" id="d">Save PDF</button>
                
                `;

        }

        function pdf() {
            document.getElementById("d").style.display = "none";
            window.print();

        }


    </script>
</body>

</html>
